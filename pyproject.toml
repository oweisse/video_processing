[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-audio-cleaner"
version = "0.5.0"
description = "Extract, denoise, and re-merge speech audio in videos (DeepFilterNet + optional Demucs)"
readme = "README.md"
# DeepFilterLib 0.5.6 (DeepFilterNet's Rust core) ships macOS wheels only for
# CPython 3.8-3.11; anything newer would need a Rust toolchain to build it.
requires-python = ">=3.10,<3.12"
dependencies = [
    "deepfilternet>=0.5.6",
    # DeepFilterNet 0.5.6 imports torchaudio.backend.common (removed in 2.2) and
    # uses torchaudio.load/info (removed later). denoise.py shims the import and
    # reads audio itself, so any recent torch works; tests/test_models.py guards it.
    "torch>=2.1",
    "torchaudio>=2.1",
    "soundfile>=0.12",
    # DeepFilterNet 0.5.x is not numpy-2 clean.
    "numpy>=1.24,<2.0",
]

[project.optional-dependencies]
separation = ["demucs>=4.0.1"]
# clean-audio-gui; pywebview only for its --window mode.
gui = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pywebview>=5"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
clean-audio = "video_audio_cleaner.cli:main"
clean-audio-tune = "video_audio_cleaner.tune:main"
clean-audio-batch = "video_audio_cleaner.batch:main"
clean-audio-gui = "video_audio_cleaner.gui.main:main"
clean-audio-export = "video_audio_cleaner.export:main"

[tool.setuptools]
packages = ["video_audio_cleaner", "video_audio_cleaner.gui"]

[tool.setuptools.package-data]
# The built frontend (cd gui && npm run build).
"video_audio_cleaner.gui" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: runs the real DeepFilterNet / Demucs models (minutes). Run with -m slow.",
    "demucs: the Demucs separation test, the slowest of the slow tier.",
]
filterwarnings = [
    # DeepFilterNet 0.5.6 imports the relocated torchaudio.backend.common.
    "ignore:.*torchaudio.backend.common.*:UserWarning",
]
